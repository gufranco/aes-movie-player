[project]
name = "neogeomedia"
version = "3.3.1"
description = "Offline baker that turns a video file into a Neo Geo AES cartridge movie ROM"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "fmvcore",
    "numpy==2.5.4",
]

[tool.uv.sources]
fmvcore = { path = "../fmv-core-python", editable = true }

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.3",
    "mypy==2.4.0",
    "faker==40.43.0",
    "z80 @ git+https://github.com/gufranco/zilog-z80-python.git@e2fedbd600640f1f5079a15668cda0662037133c",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neogeomedia"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "PL", "RUF", "ARG", "PTH"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]

[tool.mypy]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.coverage.run]
source = ["neogeomedia"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]
markers = [
    "reads_real_store: reads the project tier file without writing it",
    "ffmpeg: decodes through ffmpeg; skipped without it unless NEOGEOMEDIA_FFMPEG_REQUIRED=1",
]

