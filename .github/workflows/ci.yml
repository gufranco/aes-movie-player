---
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_FROZEN: "1"
  NEOGEOMEDIA_CC_REQUIRED: "1"

jobs:
  commits:
    name: Commit format
    runs-on: ubuntu-26.04
    if: github.event_name != 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Every subject is a conventional commit
        env:
          BASE: >-
            ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: >-
            ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null \
            || ! git merge-base --is-ancestor "$BASE" "$HEAD"; then
            BASE="$HEAD~1"
          fi
          types='feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert'
          pattern="^($types)(\\([a-z0-9 ./-]+\\))?!?: [a-z0-9]"
          limit=50
          bot='dependabot[bot]'
          bad=0
          while IFS=$'\t' read -r author subject; do
            [ -z "$subject" ] && continue
            if ! printf '%s' "$subject" | grep -qE "$pattern"; then
              echo "not a conventional, lowercase subject: $subject"
              bad=1
            fi
            if [ "$author" != "$bot" ] && [ "${#subject}" -gt "$limit" ]; then
              echo "subject over $limit characters (${#subject}): $subject"
              bad=1
            fi
          done < <(git log --format='%an%x09%s' "$BASE..$HEAD")
          if [ "$bad" -ne 0 ]; then
            echo "The release version is derived from these subjects," >&2
            echo "so the format is load-bearing." >&2
            exit 1
          fi
          echo "every subject parses"

  baker:
    name: Baker
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: true

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.12.23"
          enable-cache: true
          cache-suffix: baker

      - name: Install ffmpeg, which the decode path shells out to
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Cache the regression films
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: media/clips
          key: clips-${{ hashFiles('tools/clips.manifest.json') }}

      - name: Sync
        run: uv --project tools sync --all-groups

      - name: Format
        run: uv --project tools run ruff format --check tools/

      - name: Lint
        run: uv --project tools run ruff check tools/

      - name: Types
        run: uv --project tools run mypy tools/neogeomedia tools/scripts

      - name: Fetch the regression films
        run: uv --project tools run python tools/scripts/fetch_clips.py

      - name: Tests and coverage
        env:
          NEOGEOMEDIA_CLIPS_REQUIRED: "1"
          NEOGEOMEDIA_FFMPEG_REQUIRED: "1"
        run: |
          uv --project tools run python -m pytest tools/tests \
            --cov=neogeomedia \
            --cov=tools/scripts \
            --cov-config=tools/pyproject.toml \
            --cov-report=term-missing \
            --cov-fail-under=100

      - name: The committed tier file is not a test artefact
        run: git diff --exit-code -- neogeomedia-tiers.json

  cartridge:
    name: Cartridge
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: true

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.12.23"
          enable-cache: true
          cache-suffix: cartridge

      - name: Install ffmpeg
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Build the pinned toolchain image
        run: make image

      - name: Static analysis
        run: make analyse

      - name: Sync
        run: uv --project tools sync --all-groups

      - name: Make a source
        run: |
          ffmpeg -y -loglevel error \
            -f lavfi -i "testsrc2=size=640x480:rate=24:duration=8" \
            -f lavfi -i "sine=frequency=440:duration=8" \
            -pix_fmt yuv420p -c:a aac ci-source.mp4

      - name: Build a cartridge end to end
        run: |
          uv --project tools run python -m neogeomedia.cartridge ci-source.mp4 \
            --quality q17 --build-dir build

      - name: VRAM write spacing across the whole player
        run: make timing

      - name: The sound driver answers its commands on a Z80
        env:
          NEOGEOMEDIA_ROM_REQUIRED: "1"
        run: >-
          uv --project tools run python -m pytest
          tools/tests/test_sound_on_z80.py

      - name: The cartridge is real
        run: |
          set -euo pipefail
          test -s build/neogeomedia.neo
          test -s build/neogeomedia.zip
          size=$(wc -c < build/neogeomedia.neo)
          echo "neogeomedia.neo is $size bytes"
          test "$size" -ge 1048576

      - name: Emit a drop-in bundle
        run: |
          uv --project tools run python -m neogeomedia.bake \
            --source ci-source.mp4 --quality q17 --duration 4 \
            --build-dir build --bundle build/bundle

      - name: A developer's project builds against the bundle
        run: make example

      - name: The example produced a cartridge
        run: |
          set -euo pipefail
          rom=build/example/cutscene/build/rom
          test -s "$rom/ngdevkit.zip"
          test -s "$rom/ngdevkit-p1.p1"
          test -s "$rom/ngdevkit-p2.p2"
          echo "the example cartridge is $(wc -c < "$rom/ngdevkit.zip") bytes"

      - name: The same project builds with the movie's soundtrack
        run: |
          set -euo pipefail
          make example EXAMPLE=build/example-audio FMV_AUDIO=yes
          docker run --rm --platform linux/amd64 --user "$(id -u):$(id -g)" \
            -v "$PWD:/work" -w /work neogeo-media-player-toolchain \
            bash examples/cutscene/check_audio.sh build/example-audio

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cartridge
          path: |
            build/neogeomedia.neo
            build/neogeomedia.zip
            build/report.json
          retention-days: 14
