---
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Version and publish
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - name: Release only the commit CI passed
        id: fresh
        env:
          PASSED: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          if [ "$(git rev-parse HEAD)" = "$PASSED" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "main has moved past $PASSED; its own CI run will release it"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        if: steps.fresh.outputs.current == 'true'
        with:
          version: "0.12.23"

      - name: Run semantic-release
        id: semrel
        if: steps.fresh.outputs.current == 'true'
        uses: cycjimmy/semantic-release-action@ad51787758d9654d5a75150a89a6fa9b3ccef95e  # v8.1.4
        with:
          semantic_version: 25.0.9
          extra_plugins: |
            @semantic-release/changelog@7.0.0
            @semantic-release/exec@7.1.0
            @semantic-release/git@11.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
