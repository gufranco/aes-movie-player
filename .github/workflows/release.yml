name: Release

on:
  workflow_dispatch:
    inputs:
      level:
        description: "Force a bump level. Leave as commits to let the history decide."
        required: false
        default: commits
        type: choice
        options: [commits, patch, minor, major]

permissions:
  contents: write

env:
  UV_FROZEN: "1"

jobs:
  release:
    name: Publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
          cache-suffix: release

      - name: Install ffmpeg
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Sync
        run: uv --project tools sync --all-groups

      - name: Every gate, again, before anything is tagged
        run: |
          set -euo pipefail
          uv --project tools run ruff format --check tools/
          uv --project tools run ruff check tools/
          uv --project tools run mypy tools/aesmovie tools/scripts
          uv --project tools run python -m pytest tools/tests \
            --cov=aesmovie --cov-fail-under=95

      - name: What the next version will be
        env:
          LEVEL: ${{ inputs.level }}
        run: |
          set -euo pipefail
          if [ "$LEVEL" = "commits" ]; then
            uv --project tools run semantic-release --noop version --print
          else
            uv --project tools run semantic-release --noop version "--$LEVEL" --print
          fi

      - name: Tag and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LEVEL: ${{ inputs.level }}
        run: |
          set -euo pipefail
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          if [ "$LEVEL" = "commits" ]; then
            uv --project tools run semantic-release version --push --vcs-release
          else
            uv --project tools run semantic-release version "--$LEVEL" --push --vcs-release
          fi
