name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  UV_FROZEN: "1"

jobs:
  release:
    name: Publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock

      - name: Install ffmpeg
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Sync
        run: uv --project tools sync --all-groups

      - name: Every gate, again, before anything is tagged
        run: |
          set -euo pipefail
          uv --project tools run ruff format --check tools/
          uv --project tools run ruff check tools/
          uv --project tools run mypy tools/aesmovie tools/scripts
          uv --project tools run python -m pytest tools/tests \
            --cov=aesmovie --cov-fail-under=95

      - name: What the commits say the next version is
        run: uv --project tools run semantic-release --noop version --print

      - name: Tag and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          uv --project tools run semantic-release version --push --vcs-release
